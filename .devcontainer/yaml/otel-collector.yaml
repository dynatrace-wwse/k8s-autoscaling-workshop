# OpenTelemetry Collector config for this workshop.
#
# deployWorkshopCollector (my_functions.sh) renders it into
# .devcontainer/yaml/gen/otel-collector.yaml, replacing CLUSTER_NAME_TO_REPLACE with
# the DynaKube's cluster name, and hands it to the framework's deployOtelCollector:
#   OTEL_COLLECTOR_MODE=daemonset OTEL_COLLECTOR_POD_LOGS=true OTEL_COLLECTOR_CONFIG_FILE=<gen file>
#
# Ported from Henrik Rexed's K8s-autoscalingWorkshop (opentelemetry/otel-collector.yaml):
# OTLP + filelog on /var/log/pods, k8sattributes (incl. the resource-optimization
# annotations), cumulativetodelta, OTLP/HTTP export to Dynatrace. Changes: the
# `container` log parser replaces the hand-written docker/crio/containerd router, the
# collector's own logs are excluded, and the exporter keeps the framework's contract
# (${env:DT_ENDPOINT}, Api-Token ${env:DT_API_TOKEN}).
extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:MY_POD_IP}:4317
        max_recv_msg_size_mib: 16
      http:
        endpoint: ${env:MY_POD_IP}:4318
  filelog:
    include:
      - /var/log/pods/*/*/*.log
    exclude:
      # the collector's own output would feed itself
      - /var/log/pods/otel-collector_*/*/*.log
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      - type: container
        id: container-parser
        add_metadata_from_filepath: true
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    filter:
      node_from_env_var: K8S_NODE_NAME
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.replicaset.name
        - k8s.daemonset.name
        - k8s.statefulset.name
        - k8s.job.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.pod.start_time
        - k8s.container.name
      labels:
        - tag_name: app
          key: app
          from: pod
        - tag_name: dt.owner
          key: dt.owner
          from: pod
      annotations:
        - tag_name: resource-optimization.dynatrace.com/enabled
          key: resource-optimization.dynatrace.com/enabled
          from: pod
  resource:
    attributes:
      - key: k8s.cluster.name
        value: CLUSTER_NAME_TO_REPLACE
        action: upsert
  cumulativetodelta: {}
  batch:
    send_batch_size: 200
    timeout: 5s
    send_batch_max_size: 1000
exporters:
  otlp_http:
    endpoint: ${env:DT_ENDPOINT}
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"
    compression: gzip
    timeout: 30s
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, resource, batch]
      exporters: [otlp_http]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, resource, cumulativetodelta, batch]
      exporters: [otlp_http]
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, k8sattributes, resource, batch]
      exporters: [otlp_http]
